{% extends 'admin/layout.html' %}{% block content %}<h1>Users</h1><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Reset password / delete</th></tr>
{% for u in rows %}<tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td><form class="inline" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="user_id" value="{{ u.user_id }}"><input type="password" name="password" placeholder="new password" style="width:140px">
<button class="btn sm" name="action" value="reset">Reset</button> <button class="btn red sm" name="action" value="delete" onclick="return confirm('Delete user?')">Delete</button></form></td></tr>{% endfor %}</table>
<form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="create"><b>Register user</b><div class="grid g2"><div><label>Name</label><input name="full_name" required><label>Email</label><input type="email" name="email" required></div>
<div><label>Role</label><select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select><label>Password</label><input type="password" name="password" minlength="8" required></div></div><p><button class="btn">Create</button></p></form>{% endblock %}
